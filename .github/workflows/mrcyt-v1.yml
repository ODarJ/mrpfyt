name: MRCYT v1 (Rough Pipeline)

on:
  workflow_dispatch:
    inputs:
      yt_url:
        description: 'YouTube URL (required)'
        required: true
        type: string

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate input URL
        run: |
          URL="${{ github.event.inputs.yt_url }}"
          if [ -z "$URL" ]; then
            echo "::error::YouTube URL is required."
            exit 1
          fi
          echo "Target URL: $URL"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Prepare cookies (optional)
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
            echo "COOKIE_FLAG=--cookies cookies.txt" >> $GITHUB_ENV
            echo "Cookies restored."
          else
            echo "COOKIE_FLAG=" >> $GITHUB_ENV
            echo "No cookies provided, continuing without."
          fi

      - name: Download audio
        run: |
          yt-dlp $COOKIE_FLAG -x --audio-format mp3 \
            -o audio.mp3 "${{ github.event.inputs.yt_url }}"

      - name: Install Whisper
        run: pip install -U openai-whisper

      - name: Transcribe (English SRT)
        run: |
          whisper audio.mp3 --model small --language en \
            --output_format srt --output_dir .

      - name: Translate to Myanmar
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python translate.py audio.srt myanmar.txt

      - name: Install Myanmar TTS (f5-myanmar)
        run: |
          pip install -U f5-myanmar-tts

      - name: Generate Myanmar audio
        run: |
          f5-myanmar "$(cat myanmar.txt)" -o myanmar.wav

      - name: Download source video
        run: |
          yt-dlp $COOKIE_FLAG -f "bv*+ba/b" \
            -o video.mp4 "${{ github.event.inputs.yt_url }}"

      - name: Merge video + Myanmar audio
        run: |
          ffmpeg -y -i video.mp4 -i myanmar.wav \
            -c:v copy -map 0:v:0 -map 1:a:0 \
            -shortest output.mp4
          ls -lh output.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrcyt-output
          path: |
            output.mp4
            myanmar.txt
            audio.srt