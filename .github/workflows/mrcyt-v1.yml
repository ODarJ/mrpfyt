name: MRCYT v1 (Rough Pipeline)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'GitHub Release Video URL (.webm or .mp4)'
        required: true
        type: string

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download video from GitHub Release
        run: |
          wget -O video.webm "${{ github.event.inputs.video_url }}"

      - name: Extract audio from video
        run: |
          ffmpeg -y -i video.webm -vn -acodec libmp3lame -q:a 4 audio.mp3

      - name: Install Whisper
        run: pip install -U openai-whisper

      - name: Transcribe (English SRT)
        run: |
          whisper audio.mp3 --model small --language en \
            --output_format srt --output_dir .

      - name: Translate to Myanmar
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python translate.py audio.srt myanmar.txt

      - name: Install Myanmar TTS (f5-myanmar)
        run: |
          pip install -U f5-myanmar-tts

      - name: Generate Myanmar audio
        run: |
          f5-myanmar "$(cat myanmar.txt)" -o myanmar.wav

      - name: Merge video + Myanmar audio
        run: |
          ffmpeg -y -i video.webm -i myanmar.wav \
            -c:v copy -map 0:v:0 -map 1:a:0 \
            -shortest output.mp4
          ls -lh output.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrcyt-output
          path: |
            output.mp4
            myanmar.txt
            audio.srt